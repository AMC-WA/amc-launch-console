name: AMC weekly pipeline report
on:
  schedule:
    - cron: "0 12,13 * * 1"
    - cron: "0 22,23 * * 0"
  workflow_dispatch:
    inputs:
      to:
        description: "Send only to this address (test); leaves the weekly snapshot untouched"
        required: false
      force:
        description: "Type yes to send to all partners now regardless of the schedule"
        required: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and send the report
        env:
          AMC_TENANT_ID: ${{ secrets.AMC_TENANT_ID }}
          AMC_CLIENT_ID: ${{ secrets.AMC_CLIENT_ID }}
          AMC_CLIENT_SECRET: ${{ secrets.AMC_CLIENT_SECRET }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.to }}" ] && ARGS="$ARGS --to ${{ github.event.inputs.to }}"
          [ "${{ github.event.inputs.force }}" = "yes" ] && ARGS="$ARGS --force"
          python weekly_report.py $ARGS
      - name: Save the report in the repository
        run: |
          git config user.name "AMC Launch Console"
          git config user.email "jss@americanmilitarycommunities.com"
          git add reports
          git diff --cached --quiet || git commit -m "Weekly report $(date -u +%Y-%m-%d)"
          git push
